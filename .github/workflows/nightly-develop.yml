name: Build TRR Nightly (develop)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build-windows-nightly:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      BUILD_DIR: build-trr-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Sync and fetch submodules
        shell: pwsh
        run: |
          git config --global url."https://github.com/asmjit/asmjit.git".insteadOf "https://github.com/kobalicek/asmjit"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt dependencies via aqt (with fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.0

          $qt6Versions = @("6.8.3", "6.7.3", "6.7.2", "6.6.3")
          $qt6Root = $null
          foreach ($ver in $qt6Versions) {
            Write-Host "Trying Qt6 version: $ver"
            try {
              python -m aqt install-qt windows desktop $ver win64_msvc2022_64 --autodesktop --outputdir C:\Qt
              $candidate = "C:\Qt\$ver\msvc2022_64"
              if (Test-Path "$candidate\lib\cmake\Qt6\Qt6Config.cmake") {
                $qt6Root = $candidate
                break
              }
            }
            catch {
              Write-Warning "Qt6 $ver install failed, trying next fallback."
            }
          }

          if (-not $qt6Root) {
            throw "Could not install a usable Qt6 version from fallback list."
          }

          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --autodesktop --outputdir C:\Qt --base https://download.qt.io
          $qt5Root = "C:\Qt\5.15.2\msvc2019_64"
          if (-not (Test-Path "$qt5Root\lib\cmake\Qt5\Qt5Config.cmake")) {
            throw "Qt5Config.cmake not found at $qt5Root"
          }

          "QT6_ROOT=$qt6Root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT5_ROOT=$qt5Root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure Vulkan SDK is available
        shell: pwsh
        run: |
          if (Test-Path "C:\VulkanSDK") {
            Write-Host "VulkanSDK root already exists."
            exit 0
          }

          choco install vulkan-sdk --yes --no-progress

          if (-not (Test-Path "C:\VulkanSDK")) {
            throw "Vulkan SDK installation did not create C:\VulkanSDK"
          }

      - name: Install prebuilt LLVM libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archivePath = Join-Path $env:RUNNER_TEMP "llvmlibs_mt.7z"
          Invoke-WebRequest -Uri "https://github.com/RPCS3/llvm-mirror/releases/download/custom-build-win/llvmlibs_mt.7z" -OutFile $archivePath

          7z x -y $archivePath "-o$env:GITHUB_WORKSPACE" | Out-Null

          $llvmCandidates = @(
            (Join-Path $env:GITHUB_WORKSPACE "llvm_build\\Release\\lib\\cmake\\llvm"),
            (Join-Path $env:GITHUB_WORKSPACE "llvm_build\\lib\\cmake\\llvm"),
            (Join-Path $env:GITHUB_WORKSPACE "llvm11-build\\Release\\lib\\cmake\\llvm"),
            (Join-Path $env:GITHUB_WORKSPACE "llvm11-build\\lib\\cmake\\llvm")
          )

          $llvmDir = $null
          foreach ($candidate in $llvmCandidates) {
            if (Test-Path (Join-Path $candidate "LLVMConfig.cmake")) {
              $llvmDir = $candidate
              break
            }
          }

          if (-not $llvmDir) {
            throw "Could not locate LLVMConfig.cmake after extracting prebuilt LLVM archive."
          }

          "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build RPCS3 TRR Nightly (build-trr-release)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\quick_build_rpcs3.ps1 `
            -BuildDir .\$env:BUILD_DIR `
            -Clean `
            -DeployQt `
            -LLVMDir $env:LLVM_DIR `
            -QtRoot $env:QT6_ROOT `
            -Qt5Root $env:QT5_ROOT `
            -VulkanRoot C:\VulkanSDK

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-trr-nightly-build-logs
          path: build-trr-release/build-logs/**
          if-no-files-found: ignore

      - name: Package nightly payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binDir = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\bin"
          if (-not (Test-Path (Join-Path $binDir "rpcs3.exe"))) {
            throw "Expected artifact not found: $binDir\rpcs3.exe"
          }

          New-Item -ItemType Directory -Force -Path "nightly" | Out-Null

          $shortSha = "${env:GITHUB_SHA}".Substring(0, 8)
          $stamp = Get-Date -Format "yyyy.MM.dd"
          $packageBase = "rpcs3-trr-nightly-$stamp-$shortSha"
          $stagingDir = Join-Path "nightly" $packageBase
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Copy-Item -Path "$binDir\*" -Destination $stagingDir -Recurse -Force

          $compatDb = Join-Path $stagingDir "GuiConfigs\compat_database.dat"
          New-Item -ItemType Directory -Force -Path (Split-Path $compatDb -Parent) | Out-Null
          Invoke-WebRequest -Uri "https://rpcs3.net/compatibility?api=v1&export" -OutFile $compatDb

          $cacert = Join-Path $stagingDir "cacert.pem"
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile $cacert

          $zipPath = Join-Path "nightly" ("$packageBase.zip")
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $stagingDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashPath = "$zipPath.sha256"
          Set-Content -Path $hashPath -Value $hash -NoNewline

          "PACKAGE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_SHA256=$hashPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-trr-nightly-windows
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA256 }}
          if-no-files-found: error
